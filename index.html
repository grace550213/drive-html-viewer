<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drive HTML 檢視器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E6EBE8;
    --surface: #F7F9F8;
    --ink: #16211D;
    --muted: #56645E;
    --line: #C6D0CB;
    --accent: #1E6B58;
    --accent-ink: #FFFFFF;
    --danger: #A23B2A;
    --frame: #22302B;
    --frame-ink: #DCE6E1;
    --radius-lg: 14px;
    --radius-sm: 8px;
    --font: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111714;
      --surface: #19211E;
      --ink: #E2E9E5;
      --muted: #94A39C;
      --line: #2C3934;
      --accent: #5FBFA3;
      --accent-ink: #0E1915;
      --danger: #E8836F;
      --frame: #0B110F;
      --frame-ink: #C9D6D0;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
  }
  body.is-locked { overflow: hidden; }

  .page { max-width: 1200px; margin: 0 auto; padding: 32px 20px 48px; }

  header h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 4px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); max-width: 62ch; }

  .loader { margin-top: 24px; display: flex; gap: 10px; }
  .loader input { flex: 1; min-width: 0; }

  input[type="text"], input[type="password"] {
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
  }
  input:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
    outline-offset: 2px;
  }

  button {
    font: inherit;
    font-weight: 600;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    padding: 10px 18px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:disabled { opacity: .55; cursor: progress; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-quiet { background: transparent; color: var(--ink); border-color: var(--line); }

  .settings { margin-top: 12px; color: var(--muted); font-size: .9375rem; }
  .settings summary { cursor: pointer; width: fit-content; }
  .settings-body { margin-top: 10px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); max-width: 640px; }
  .settings-body .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .settings-body .row input { flex: 1; min-width: 220px; }
  .settings-body p { margin: 10px 0 0; }
  .settings-body a { color: var(--accent); }

  .status { min-height: 1.6em; margin: 14px 0 0; font-size: .9375rem; color: var(--muted); }
  .status[data-kind="error"] { color: var(--danger); }
  .status[data-kind="ok"] { color: var(--accent); }

  /* ---------- Stage: a browser-window frame around the rendered page ---------- */
  .viewer {
    margin-top: 16px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--frame);
    box-shadow: 0 1px 0 var(--line), 0 18px 40px -24px rgba(10, 30, 22, .45);
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px 8px 16px;
    color: var(--frame-ink);
    font-size: .875rem;
  }
  .bar .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar button { padding: 6px 12px; font-size: .8125rem; background: rgba(255,255,255,.08); color: var(--frame-ink); }
  .bar button:hover { background: rgba(255,255,255,.16); }
  .bar .open-full { background: var(--accent); color: var(--accent-ink); }
  .bar .open-full:hover { background: var(--accent); filter: brightness(1.08); }

  .screen { position: relative; height: clamp(420px, 72vh, 920px); background: #fff; }
  .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }

  .empty {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 24px;
    background: var(--surface);
    color: var(--ink);
  }
  .empty ol { margin: 0; padding-left: 1.4em; max-width: 46ch; }
  .empty li + li { margin-top: 8px; }
  .empty h2 { font-size: 1.125rem; margin: 0 0 12px; }

  .viewer:not(.has-page) .bar button { display: none; }
  .viewer.has-page .empty { display: none; }

  /* ---------- Full mode: same iframe, stretched to the whole window ---------- */
  .viewer.is-full {
    position: fixed; inset: 0; z-index: 50;
    margin: 0; border-radius: 0; box-shadow: none;
    background: #fff;
  }
  .viewer.is-full .bar { display: none; }
  .viewer.is-full .screen { height: 100%; }

  .float-ctrl {
    display: none;
    position: fixed;
    right: max(14px, env(safe-area-inset-right, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    z-index: 60;
    gap: 6px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(22, 33, 29, .78);
    backdrop-filter: blur(6px);
    opacity: .4;
    transition: opacity .15s ease;
  }
  .float-ctrl:hover, .float-ctrl:focus-within { opacity: 1; }
  .float-ctrl button { padding: 6px 14px; font-size: .8125rem; border-radius: 999px; background: transparent; color: #EAF2EE; }
  .float-ctrl button:hover { background: rgba(255,255,255,.14); }
  .viewer.is-full ~ .float-ctrl { display: flex; }

  .note { margin-top: 18px; font-size: .875rem; color: var(--muted); max-width: 72ch; }

  @media (max-width: 600px) {
    .page { padding: 20px 14px 32px; }
    .loader { flex-direction: column; }
    .bar { flex-wrap: wrap; }
    .bar .name { flex-basis: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .float-ctrl { transition: none; }
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>Drive HTML 檢視器</h1>
    <p>貼上 Google 雲端硬碟裡 HTML 檔的共用連結，就能在這裡看到渲染後的網頁，也能切到全畫面，像直接開啟那個網頁一樣。</p>
  </header>

  <form class="loader" id="loader">
    <input type="text" id="link" inputmode="url" autocomplete="off" spellcheck="false"
           placeholder="https://drive.google.com/file/d/…/view" aria-label="雲端硬碟共用連結">
    <button type="submit" class="btn-primary" id="loadBtn">載入網頁</button>
  </form>

  <!-- <details class="settings" id="settings">
    <summary>API 金鑰設定</summary>
    <div class="settings-body">
      <div class="row">
        <input type="password" id="keyInput" autocomplete="off" spellcheck="false" aria-label="Google API 金鑰">
        <button type="button" class="btn-primary" id="saveKey">儲存金鑰</button>
        <button type="button" class="btn-quiet" id="clearKey">清除</button>
      </div>
      <p>讀取雲端硬碟檔案需要一把啟用了 Google Drive API 的金鑰。金鑰只存在這台裝置的瀏覽器裡；若想讓別人打開分享連結時不必自己輸入，請把金鑰寫進原始碼最上方的 <code>BUILT_IN_API_KEY</code>，並在 Google Cloud 限制它只能從你的 GitHub Pages 網址使用。</p>
    </div>
  </details> -->

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <section class="viewer" id="viewer" aria-label="網頁預覽">
    <div class="bar">
      <span class="name" id="fileName">尚未載入</span>
      <button type="button" id="copyLink">複製分享連結</button>
      <button type="button" id="closePage">關閉</button>
      <button type="button" class="open-full" id="openFull">全畫面開啟</button>
    </div>
    <div class="screen">
      <iframe id="frame" title="渲染後的網頁"
              sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
      <div class="empty">
        <div>
          <h2>開始使用</h2>
          <ol>
            <!-- <li>在上方「API 金鑰設定」填入啟用 Google Drive API 的金鑰。</li> -->
            <li>到雲端硬碟把 HTML 檔的一般存取權設為「知道連結的任何人」。</li>
            <li>複製共用連結，貼到上方欄位後按「載入網頁」。</li>
          </ol>
        </div>
      </div>
    </div>
  </section>

  <div class="float-ctrl" id="floatCtrl" aria-label="全畫面控制">
    <button type="button" id="nativeFs">瀏覽器全螢幕</button>
    <button type="button" id="closeFull">關閉全畫面</button>
  </div>

  <p class="note">網頁在隔離的沙盒中執行：可以跑 JavaScript、CDN 函式庫、表單與測驗互動，但讀不到這個檢視器的資料。用相對路徑引用的圖片或 CSS 不會載入，請改成完整網址或直接內嵌在 HTML 裡。網頁本身若使用 localStorage，在沙盒中會無法儲存。</p>
</main>

<script>
/* 想讓別人開分享連結時免輸入金鑰，就把金鑰填在這裡（記得在 Google Cloud 設定網站限制） */
const BUILT_IN_API_KEY = 'AIzaSyDtn0DZufW8JGhPg6qIzjVR1wUz1WHe7mw';

const STORAGE_KEY = 'driveHtmlViewer.apiKey';
const $ = (id) => document.getElementById(id);
const viewer = $('viewer'), frame = $('frame'), statusEl = $('status');

let current = null; // { id, rk, name }

/* ---------- API key ---------- */
function storedKey() {
  try { return localStorage.getItem(STORAGE_KEY) || ''; } catch { return ''; }
}
function activeKey() { return storedKey() || BUILT_IN_API_KEY; }
function refreshKeyField() {
  $('keyInput').value = storedKey();
  $('keyInput').placeholder = BUILT_IN_API_KEY ? '正在使用頁面內建的金鑰' : '貼上 API 金鑰（AIza 開頭）';
}
$('saveKey').addEventListener('click', () => {
  const v = $('keyInput').value.trim();
  if (!v) { setStatus('error', '金鑰欄位是空的，請貼上金鑰後再儲存。'); return; }
  try { localStorage.setItem(STORAGE_KEY, v); setStatus('ok', '金鑰已儲存在這台裝置。'); }
  catch { setStatus('error', '瀏覽器不允許儲存資料，金鑰只會在這次瀏覽期間有效。'); }
});
$('clearKey').addEventListener('click', () => {
  try { localStorage.removeItem(STORAGE_KEY); } catch {}
  refreshKeyField();
  setStatus('ok', '已清除這台裝置上的金鑰。');
});

/* ---------- Helpers ---------- */
function setStatus(kind, text) {
  statusEl.dataset.kind = kind;
  statusEl.textContent = text;
}

function parseDriveLink(input) {
  const s = (input || '').trim();
  if (!s) return null;
  let id = null, rk = null;
  try {
    const u = new URL(s);
    if (!/(^|\.)google\.com$/.test(u.hostname)) return null;
    const m = u.pathname.match(/\/d\/([\w-]{10,})/);
    id = m ? m[1] : u.searchParams.get('id');
    rk = u.searchParams.get('resourcekey');
  } catch {
    if (/^[\w-]{10,}$/.test(s)) id = s; // 直接貼檔案 ID 也可以
  }
  return id ? { id, rk } : null;
}

function explainError(status, body) {
  const err = body && body.error ? body.error : {};
  const msg = (err.message || '').toLowerCase();
  const reason = (err.errors && err.errors[0] && err.errors[0].reason) || '';
  const detailReason = JSON.stringify(err.details || '');

  if (msg.includes('api key not valid') || detailReason.includes('API_KEY_INVALID'))
    return 'API 金鑰無效，請確認金鑰有完整貼上。';
  if (detailReason.includes('REFERRER') || msg.includes('referer'))
    return '金鑰的網站限制擋下了這次請求。請在 Google Cloud 把目前這個網址加入允許的網站。';
  if (detailReason.includes('SERVICE_DISABLED') || reason === 'accessNotConfigured' || msg.includes('has not been used') || msg.includes('disabled'))
    return '這把金鑰所屬的專案還沒啟用 Google Drive API，請到 Google Cloud 啟用後再試。';
  if (status === 404 || reason === 'notFound')
    return '找不到檔案。請確認連結正確，且一般存取權已設為「知道連結的任何人」。';
  if (reason === 'downloadQuotaExceeded' || reason === 'userRateLimitExceeded' || status === 429)
    return '這個檔案的下載次數暫時超過上限，請稍後再試。';
  if (status === 403)
    return '沒有權限讀取這個檔案（' + (err.message || '403') + '）。請確認檔案已公開分享。';
  return '讀取失敗（' + status + (err.message ? '：' + err.message : '') + '）。';
}

async function driveRequest(id, rk, key, query) {
  const url = 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) +
              '?' + query + '&supportsAllDrives=true&key=' + encodeURIComponent(key);
  const headers = rk ? { 'X-Goog-Drive-Resource-Keys': id + '/' + rk } : {};
  let res;
  try { res = await fetch(url, { headers }); }
  catch { throw new Error('連不上 Google 伺服器，請檢查網路連線。'); }
  if (!res.ok) {
    let body = null;
    try { body = await res.json(); } catch {}
    throw new Error(explainError(res.status, body));
  }
  return res;
}

function viewerUrl({ id, rk }, full) {
  const u = new URL(location.href);
  u.search = '';
  u.hash = '';
  u.searchParams.set('id', id);
  if (rk) u.searchParams.set('rk', rk);
  if (full) u.searchParams.set('full', '1');
  return u.toString();
}

/* ---------- Load & render ---------- */
async function loadPage(target, { full = false } = {}) {
  const key = activeKey();
  if (!key) {
    $('settings').open = true;
    $('keyInput').focus();
    setStatus('error', '還沒有設定 API 金鑰。請先在「API 金鑰設定」貼上金鑰。');
    return;
  }
  $('loadBtn').disabled = true;
  setStatus('busy', '正在從雲端硬碟讀取檔案…');
  try {
    const meta = await (await driveRequest(target.id, target.rk, key, 'fields=name,mimeType')).json();
    const name = meta.name || '未命名檔案';
    const mime = meta.mimeType || '';
    if (mime.startsWith('application/vnd.google-apps'))
      throw new Error('「' + name + '」是 Google 文件格式，不是 HTML 檔。請上傳 .html 檔案本身。');
    const looksHtml = mime === 'text/html' || /\.html?$/i.test(name);
    if (!looksHtml)
      throw new Error('「' + name + '」的類型是 ' + (mime || '未知') + '，不是 HTML 檔。');

    const html = await (await driveRequest(target.id, target.rk, key, 'alt=media')).text();

    current = { id: target.id, rk: target.rk, name };
    frame.srcdoc = html;
    viewer.classList.add('has-page');
    $('fileName').textContent = name;
    $('link').value = 'https://drive.google.com/file/d/' + target.id + '/view' + (target.rk ? '?resourcekey=' + target.rk : '');
    history.replaceState(null, '', viewerUrl(current, false));
    setStatus('ok', '已載入「' + name + '」。');
    if (full) enterFull();
  } catch (e) {
    setStatus('error', e.message);
  } finally {
    $('loadBtn').disabled = false;
  }
}

$('loader').addEventListener('submit', (e) => {
  e.preventDefault();
  const target = parseDriveLink($('link').value);
  if (!target) {
    setStatus('error', '這看起來不是雲端硬碟的檔案連結。請貼上「共用」複製的連結，格式像 https://drive.google.com/file/d/…/view。');
    return;
  }
  loadPage(target);
});

/* ---------- Full mode ---------- */
function enterFull() {
  if (!current) return;
  viewer.classList.add('is-full');
  document.body.classList.add('is-locked');
  document.title = current.name.replace(/\.html?$/i, '');
  history.pushState({ full: true }, '', viewerUrl(current, true));
  $('closeFull').focus();
}

function leaveFullVisual() {
  viewer.classList.remove('is-full');
  document.body.classList.remove('is-locked');
  document.title = 'Drive HTML 檢視器';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  $('openFull').focus();
}

function exitFull() {
  if (history.state && history.state.full) history.back(); // popstate 會接手
  else leaveFullVisual();
}

window.addEventListener('popstate', () => {
  if (viewer.classList.contains('is-full')) leaveFullVisual();
});

$('openFull').addEventListener('click', enterFull);
$('closeFull').addEventListener('click', exitFull);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && viewer.classList.contains('is-full') && !document.fullscreenElement) exitFull();
});

if (document.fullscreenEnabled) {
  $('nativeFs').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen().catch(() => {});
  });
  document.addEventListener('fullscreenchange', () => {
    $('nativeFs').textContent = document.fullscreenElement ? '離開瀏覽器全螢幕' : '瀏覽器全螢幕';
  });
} else {
  $('nativeFs').hidden = true; // 例如 iPhone Safari 不支援
}

/* ---------- Bar actions ---------- */
$('closePage').addEventListener('click', () => {
  current = null;
  frame.removeAttribute('srcdoc');
  frame.src = 'about:blank';
  viewer.classList.remove('has-page');
  $('fileName').textContent = '尚未載入';
  history.replaceState(null, '', location.pathname);
  setStatus('', '');
});

$('copyLink').addEventListener('click', async () => {
  if (!current) return;
  const link = viewerUrl(current, true);
  try {
    await navigator.clipboard.writeText(link);
    setStatus('ok', '已複製分享連結，對方打開會直接以全畫面顯示這個網頁。');
  } catch {
    window.prompt('複製這個連結：', link);
  }
});

/* ---------- Start: open ?id=… directly ---------- */
refreshKeyField();
(function boot() {
  const p = new URLSearchParams(location.search);
  const id = p.get('id');
  if (!id || !/^[\w-]{10,}$/.test(id)) return;
  const target = { id, rk: p.get('rk') };
  const full = p.get('full') === '1';
  history.replaceState(null, '', viewerUrl(target, false)); // 讓「上一頁」能正確關閉全畫面
  loadPage(target, { full });
})();
</script>
</body>
</html>
